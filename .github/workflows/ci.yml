name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The declared support matrix; keep it in step with the README's
    # "Tested compatibility" table. The `*` peer range is not evidence.
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.0, 24.21.0]
        pi: [0.85.1, 0.87.1]
    name: Node ${{ matrix.node }}, Pi ${{ matrix.pi }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Use Pi ${{ matrix.pi }} over the locked 0.85.1
        if: matrix.pi != '0.85.1'
        run: >-
          npm install --no-save --ignore-scripts --save-exact
          @earendil-works/pi-coding-agent@${{ matrix.pi }}
          @earendil-works/pi-tui@${{ matrix.pi }}
          @earendil-works/pi-ai@${{ matrix.pi }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package
      - run: npm run smoke:install -- ${{ matrix.pi }}
